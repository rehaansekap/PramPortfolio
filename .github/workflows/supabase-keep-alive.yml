name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan setiap 2 hari sekali pada pukul 04:00 UTC (11:00 WIB)
    - cron: '0 4 */2 * *'
  workflow_dispatch: # Mengizinkan trigger manual lewat tombol "Run workflow" di GitHub Actions

jobs:
  ping-supabase:
    name: Keep Supabase Active
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL || 'https://vszqvnjuwmczcusaznut.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY belum diatur di GitHub Secrets! Silakan tambahkan secret 'SUPABASE_ANON_KEY' di Settings repo GitHub Anda."
            exit 1
          fi

          echo "Mengirim ping ke Supabase untuk me-reset timer auto-pause..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response Body:"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Berhasil! Supabase aktif dan timer auto-pause berhasil di-reset."
          else
            echo "❌ Gagal melakukan ping ke Supabase (HTTP Status: $HTTP_STATUS)"
            exit 1
          fi
